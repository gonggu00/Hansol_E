<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한솔빌트인 / v3.10</title>
<link rel="stylesheet" href="style.css">

<!-- PWA: PC/모바일에서 "설치" 또는 "홈 화면에 추가"가 가능하도록 하는 설정 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한솔 E-Catalog">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 표지(시작화면) -->
<div id="cover-screen" onclick="openBook()">
    <div class="cover-stage">
        <div class="cover-floor-shadow"></div>
        <div class="cover-frame">
            <img class="cover-img" id="cover-img" src="">
        </div>
        <div class="cover-hint">클릭하여 카탈로그 열기 ▶</div>
        <div class="cover-version-hint">v3.10</div>
    </div>
</div>

<!-- 상단바(브랜드/줄보기/구버전 페이지표시)는 화면에서 완전히 숨김(CSS에서 항상 display:none 처리) -->
<div id="top-bar" style="display:none;">
    <div class="brand">한솔빌트인 <span>E-Catalog</span><span class="offline-badge">OFFLINE / turn.js</span><span class="version-badge">v3.10</span></div>
    <div id="top-bar-right">
        <div class="icon-group">
            <div class="icon-btn" id="btn-zoom" title="확대해서 보기" onclick="openZoom()">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line></svg>
            </div>
        </div>
    </div>
</div>

<!-- 새 페이지 표시 + 확대버튼: 화면 정중앙 상단에 하나의 배지로 함께 표시 -->
<div id="top-page-indicator-center">
    <span id="top-page-indicator-text">1</span>
    <span class="topbar-divider"></span>
    <div class="icon-btn mobile-zoom-btn" id="btn-zoom-mobile" title="확대해서 보기" onclick="openZoom()">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="20.5" y2="20.5"/><line x1="10" y1="7.5" x2="10" y2="12.5"/><line x1="7.5" y1="10" x2="12.5" y2="10"/></svg>
    </div>
</div>

<div id="viewport" style="display:none;">
    <div id="book-ambient-shadow"></div>
    <div id="book-frame-shadow"></div>
    <div id="book-floor-shadow-soft"></div>
    <div id="book-floor-shadow"></div>
    <div id="book-thickness-right"></div>
    <div id="book-backing"></div>
    <div id="flipbook"></div>
    <div id="edge-zone-left" title="이전 페이지"></div>
    <div id="edge-zone-right" title="다음 페이지"></div>
    <div id="hotspot-layer"></div>
    <div id="video-hotspot-layer"></div>
    <div id="book-gutter-shadow"></div>
    <div id="memo-dot-layer"></div>
</div>

<!-- 확대(돋보기) 오버레이 -->
<div class="zoom-overlay" id="zoom-overlay">
    <div class="zoom-toolbar">
        <div class="zbtn" onclick="zoomChange(-0.25)">－</div>
        <div class="zbtn" id="zoom-pct" onclick="zoomReset()">100%</div>
        <div class="zbtn" onclick="zoomChange(0.25)">＋</div>
        <div class="zbtn zoom-close" onclick="closeZoom()">✕ 닫기</div>
    </div>
    <div class="zoom-viewport" id="zoom-viewport">
        <div class="zoom-canvas" id="zoom-canvas">
            <img id="zoom-img-left" style="display:none;">
            <img id="zoom-img-right" style="display:none;">
        </div>
    </div>
    <div class="zoom-hint">마우스 휠로 확대/축소 · 드래그로 이동</div>
</div>

<div class="flip-arrow" id="arrow-prev" onclick="flipPrev()" style="display:none;">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M27 15 L18 24 L27 33" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="flip-arrow" id="arrow-next" onclick="flipNext()" style="display:none;">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M21 15 L30 24 L21 33" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<!-- 하단 메뉴 바: 목차 / 검색 / 페이지 / 메모 / 전체 -->
<div id="bottombar" style="display:none;">
    <button class="barBtn" data-panel="toc" onclick="openPanel('toc')">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        <span>목차</span>
    </button>
    <button class="barBtn" data-panel="search" onclick="openPanel('search')">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <span>검색</span>
    </button>
    <button class="barBtn" data-panel="page" onclick="openPanel('page')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
        <span>페이지</span>
    </button>
    <button class="barBtn" data-panel="memo" onclick="openPanel('memo')">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><line x1="7.5" y1="8" x2="16.5" y2="8"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><line x1="7.5" y1="16" x2="13" y2="16"/></svg>
        <span>메모</span>
    </button>
    <button class="barBtn" data-panel="fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="20.5" y2="20.5"/><line x1="10" y1="7.5" x2="10" y2="12.5"/><line x1="7.5" y1="10" x2="12.5" y2="10"/></svg>
        <span>전체</span>
    </button>
</div>

<!-- 오버레이 패널: 목차 / 검색 / 페이지 / 메모 공용 -->
<div id="overlay" class="hidden" onclick="if(event.target===this) closePanel()">
    <div id="panel">
        <div id="panelHeader">
            <span id="panelTitle"></span>
            <button id="panelClose" onclick="closePanel()">닫기</button>
        </div>
        <div id="panelBody"></div>
    </div>
</div>

<script src="libs/jquery.min.js"></script>
<script src="libs/turn.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<div id="video-modal" hidden>
    <div id="video-modal-inner">
        <button id="video-modal-close" type="button" aria-label="닫기">&times;</button>
        <button id="video-modal-unmute" type="button" hidden>🔇 소리 켜기</button>
        <div id="video-modal-error" hidden></div>
        <video id="video-modal-player" playsinline></video>
        <div id="video-controls-bar">
            <input type="range" id="video-progress" min="0" max="100" value="0" step="0.1" aria-label="재생 진행바">
            <div id="video-buttons-row">
                <button id="video-btn-rewind" type="button" aria-label="3초 뒤로">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M11 19V5l-8 7 8 7zm10 0V5l-8 7 8 7z" fill="currentColor"/></svg>
                </button>
                <button id="video-btn-playpause" type="button" aria-label="일시정지" class="is-playing">
                    <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
                    <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M7 4l14 8-14 8V4z" fill="currentColor"/></svg>
                </button>
                <button id="video-btn-forward" type="button" aria-label="3초 앞으로">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 5v14l8-7-8-7zM3 5v14l8-7-8-7z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
